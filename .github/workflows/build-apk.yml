name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Bump versionCode per build
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Use fixed signing key (keeps updates installable over old versions)
        run: |
          mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file('../../keystore/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Diagnose APK
        run: |
          grep -n "versionCode\|versionName\|applicationId" android/app/build.gradle
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep SHA256
          keytool -list -keystore keystore/debug.keystore -storepass android | grep -i sha
      - uses: actions/upload-artifact@v4
        with:
          name: alpaca-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
